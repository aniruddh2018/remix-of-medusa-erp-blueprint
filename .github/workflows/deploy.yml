name: Build and Deploy ERP to AKS

on:
  push:
    branches:
      
      - feature/multi-tenant-ai-capture

env:
  ACR_NAME: erpregistry2004.azurecr.io
  IMAGE_NAME: erp-frontend
  RESOURCE_GROUP: rg-erp-dev
  CLUSTER_NAME: aks-erp-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image (Tagged with Git SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy New Image to AKS
        run: |
          kubectl set image deployment/erp-frontend erp-app=${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl rollout status deployment/erp-frontend
